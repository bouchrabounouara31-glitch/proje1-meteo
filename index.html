<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Weather App</title>
</head>
<body>
    <div class="card">
        <div class="search">
            <input type="text" placeholder="Enter city name" spellcheck="false">
            <button><img src="images/search.png"></button>
        </div>

        <div class="weather">
            <img src="images/weather.png" class="weather-icon">
            <h1 class="temp">24°C</h1>
            <h2 class="city">Casablanca</h2>

            <div class="details">
                <div class="col">
                    <img src="images/humdity.png">
                    <div>
                        <p class="humidity">50%</p>
                        <p>Humidity</p>
                    </div>
                </div>
                <div class="col">
                    <img src="images/wind.png">
                    <div>
                        <p class="wind">15 km/h</p>
                        <p>Wind Speed</p>
                    </div>
                </div>
            </div>

            <!-- هنا فين خاصو يكون -->
            <div class="water-level" id="waterLevel">
                <div class="water-icon">〰️</div>
                <div class="water-info">
                    <p class="water-title">River Water Level</p>
                    <h3 id="waterValue">2.4 m</h3>
                    <p id="waterStation">Sebou River</p>
                    <small id="waterUpdated">Updated just now</small>
                </div>
            </div>

        </div>
    </div> 
   <script src="script.js"></script>
</body>
</html>
